name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=20. Node 18 is not in the matrix because the dev
        # dependencies and peers refuse it: Vitest 4 needs 20+, ai 7 needs 22+,
        # @langchain/core 1 and Next 16 need 20+.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # pnpm first, from package.json's packageManager field (pnpm 9.x: the
      # 10+ line needs Node 22.13), then Node with the pnpm store cache.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Generated types are current
        run: |
          pnpm generate:types
          git diff --exit-code -- src/generated

      - name: Package contents are publishable
        run: pnpm check:package

  example:
    name: Example app builds against the built SDK
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/vercel-ai-chatbot/pnpm-lock.yaml

      - name: Build the SDK
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Install and build the example
        working-directory: examples/vercel-ai-chatbot
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Mock server starts and answers
        run: |
          node examples/mock-server/server.mjs &
          sleep 1
          curl --fail --silent http://localhost:8787/health
          kill %1
