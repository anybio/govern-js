# Release: publish @anybio/govern to npm on a version tag.
#
# Publishing uses npm Trusted Publishing (OIDC from GitHub Actions); no npm
# token is stored. The workflow refuses a tag that does not match the
# version in package.json, and `npm publish` runs `prepublishOnly`, which
# includes the package contents check.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and stage on npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # pnpm first, from package.json's packageManager field, then Node.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Upgrade npm (trusted publishing needs npm 11.5 or later; pinned to one major)
        run: npm install -g npm@11 && npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version" >&2
            exit 1
          fi

      - name: Lint, typecheck, test
        run: pnpm lint && pnpm typecheck && pnpm test

      - name: Build
        run: pnpm build

      - name: Publish
        run: npm publish --provenance --access public
